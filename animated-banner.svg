<svg fill="none" viewBox="0 0 800 200" width="100%" xmlns="http://w3.org">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://w3.org">
      <style>
        .banner {
          font-family: system-ui, sans-serif;
          background: #0d1117;
          color: #58a6ff;
          padding: 40px;
          text-align: center;
          animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
          0% { opacity: 0.7; }
          50% { opacity: 1; }
          100% { opacity: 0.7; }
        }
        @media (prefers-color-scheme: light) {
          .banner { background: #f6f8fa; color: #0969da; }
        }
      </style>
      <div class="banner">
        <h1>Welcome to My Dynamic Project!</h1>
      </div>
    </div>
  </foreignObject>
</svg>